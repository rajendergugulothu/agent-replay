[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-replay"
version = "0.1.0"
description = "Find where an AI agent run broke, fix that step, and resume from it."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.163.1",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
    "openai==3.52.0",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff==0.17.5",
    "mypy==2.4.1",
    "types-PyYAML==6.0.12.20261113",
    "pip-audit==2.10.1",
]

[tool.setuptools.packages.find]
include = ["agent_replay*"]

[tool.setuptools.package-data]
agent_replay = ["catalog/*.json", "localizers/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real OpenAI API, run only with -m live"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# The formatter wraps code. Long prompt and message strings are left whole.
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = true
