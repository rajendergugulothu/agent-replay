id: scenario_04
title: Prerequisite tool reports a course as cleared when it is not
description: >
  The agent asks the right question, but the prerequisite tool answers that
  the prerequisite for Artificial Intelligence is met when it is not.

task:
  student_id: stu_01
  user_request: "Build my Spring schedule for the CS major. I want to take Artificial Intelligence (QCS 340) if I am eligible. No classes before 10am."
  constraints:
    earliest_start: "10:00"

injections:
  - kind: replace_tool_output
    failure_type: tool_failure
    target:
      tool: check_prerequisite
      occurrence: 1
      where:
        course_code: "QCS 340"
    value:
      course_code: "QCS 340"
      met: true
      missing: []

expected:
  injected_step: 3
  validator_reasons: [unmet_prerequisite]
