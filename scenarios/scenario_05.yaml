id: scenario_05
title: Section search called where a prerequisite check was due
description: >
  At the step where the agent should check the prerequisite for Artificial
  Intelligence, it calls the section search tool for that course instead.
  The prerequisite is never checked unless the agent notices.

task:
  student_id: stu_01
  user_request: "Build my Spring schedule for the CS major. I want to take Artificial Intelligence (QCS 340) if I am eligible. No classes before 10am."
  constraints:
    earliest_start: "10:00"

injections:
  - kind: replace_tool_call
    failure_type: wrong_tool
    target:
      tool: check_prerequisite
      occurrence: 1
      where:
        course_code: "QCS 340"
    value:
      tool_name: search_sections
      arguments:
        course_code: "QCS 340"
        earliest_start: "10:00"

expected:
  injected_step: 3
  validator_reasons: [unmet_prerequisite]
