name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check agent_replay tests && ruff format --check agent_replay tests
      - name: Type check
        run: mypy agent_replay
      - name: Tests
        run: pytest -q --cov=agent_replay --cov-fail-under=80
      - name: Dependency audit
        run: pip-audit --skip-editable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm run test
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The browser test starts backend/.venv/bin/python, so create that venv.
      - name: Install backend
        working-directory: backend
        run: python -m venv .venv && .venv/bin/pip install -e ".[dev]"
      - name: Install frontend and browser
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Browser test against the fake model
        working-directory: frontend
        run: npm run build && npm run e2e -- --trace off

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image builds and runs as a non-root user
        run: |
          docker build -t agent-replay:ci .
          test "$(docker run --rm agent-replay:ci id -u)" = "10001"
